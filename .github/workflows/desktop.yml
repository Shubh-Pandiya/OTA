name: Desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", "app/src/main/java/**", "app/src/main/res/values/pdf_marks.xml", "app/src/main/res/raw/stamp_path.txt", "supabase.properties", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the installer as a GitHub Release (tag desktop-v<version>)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # services.gradle.org / its GitHub mirror intermittently time out from hosted runners, so fetch
      # the distribution with curl (retries + mirrors), verify the pinned SHA-256 and point the
      # wrapper at the local copy.
      - name: Fetch Gradle distribution
        run: |
          $props = "gradle/wrapper/gradle-wrapper.properties"
          $text = Get-Content $props -Raw
          $url = ([regex]'distributionUrl=(.+)').Match($text).Groups[1].Value.Trim().Replace('\:', ':')
          $sha = ([regex]'distributionSha256Sum=(\w+)').Match($text).Groups[1].Value
          $name = Split-Path $url -Leaf
          $ver = ([regex]'gradle-(.+)-bin\.zip').Match($name).Groups[1].Value
          $zip = Join-Path $env:RUNNER_TEMP $name
          $mirrors = @($url, "https://github.com/gradle/gradle-distributions/releases/download/v$ver/$name", "https://mirrors.cloud.tencent.com/gradle/$name")
          $ok = $false
          for ($round = 1; $round -le 5 -and -not $ok; $round++) {
            foreach ($m in $mirrors) {
              Write-Host "Round ${round}: $m"
              curl.exe -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 600 -o $zip $m
              if ($LASTEXITCODE -eq 0 -and (Get-FileHash $zip -Algorithm SHA256).Hash -ieq $sha) { $ok = $true; break }
            }
            if (-not $ok) { Start-Sleep -Seconds (20 * $round) }
          }
          if (-not $ok) { throw "Could not download $name" }
          $fileUrl = "file:///" + ($zip -replace '\\', '/')
          $text = $text -replace 'distributionUrl=.+', ("distributionUrl=" + $fileUrl.Replace(':', '\:'))
          Set-Content $props $text -NoNewline
          ./gradlew.bat --version
          if ($LASTEXITCODE -ne 0) { throw "Gradle wrapper failed" }

      # Unit tests boot the embedded PostgreSQL, run the migrations and exercise sync against an
      # in-process fake Supabase: no secrets needed.
      - name: Test
        run: ./gradlew.bat test -PpgPlatform=windows-amd64 --console=plain

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: desktop/build/test-results/test/*.xml
          if-no-files-found: ignore

      # The Compose plugin downloads WiX from a GitHub release asset that often answers 504; provide
      # WiX ourselves (pinned NuGet package, else a runner-installed copy) and point WIX_PATH at it,
      # which makes the plugin skip its own download.
      - name: Provide WiX toolset
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP "wix.3.11.2.zip"
          $sha = "ac2fff0541f87756b530c93ca3a45ff2dfb1ebe392c269901de0c19074bec5d0"
          $ok = $false
          for ($round = 1; $round -le 5 -and -not $ok; $round++) {
            curl.exe -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 -o $pkg "https://www.nuget.org/api/v2/package/wix/3.11.2"
            if ($LASTEXITCODE -eq 0 -and (Get-FileHash $pkg -Algorithm SHA256).Hash -ieq $sha) { $ok = $true } else { Start-Sleep -Seconds (15 * $round) }
          }
          if ($ok) {
            Expand-Archive $pkg -DestinationPath (Join-Path $env:RUNNER_TEMP "wixpkg") -Force
            $bin = Join-Path $env:RUNNER_TEMP "wixpkg\tools"
          } else {
            $bin = Resolve-Path "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin" -ErrorAction SilentlyContinue | Select-Object -Last 1 -ExpandProperty Path
          }
          if (-not $bin -or -not (Test-Path (Join-Path $bin "candle.exe"))) { throw "WiX toolset unavailable" }
          Write-Host "WiX at $bin"
          "WIX_PATH=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installers (MSI + EXE)
        run: ./gradlew.bat packageMsi packageExe -PpgPlatform=windows-amd64 --console=plain

      # Install the MSI like a user would (per-user, silent), then start the installed app in
      # self-test mode: it boots the bundled PostgreSQL, migrates the schema and exits.
      - name: Install and self-test
        run: |
          $msi = Get-ChildItem build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          Write-Host "Installing $($msi.Name) ($([math]::Round($msi.Length / 1MB, 1)) MB)"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v `"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 60; throw "msiexec failed: $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\OTA Business" -Recurse -Filter "OTA Business.exe" | Select-Object -First 1
          if (-not $exe) { throw "Installed app not found" }
          Write-Host "Installed at $($exe.FullName)"
          $report = "$env:RUNNER_TEMP\self-test.txt"
          $run = Start-Process $exe.FullName -ArgumentList "--self-test", "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($run.ExitCode -ne 0 -or -not (Select-String -Path $report -Pattern '^OK$' -Quiet)) { throw "Self-test failed ($($run.ExitCode))" }
          # A second start re-uses the existing cluster (the normal day-to-day launch).
          $run = Start-Process $exe.FullName -ArgumentList "--self-test", "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($run.ExitCode -ne 0) { throw "Second self-test failed" }
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn" -Wait -PassThru
          if (-not (Test-Path "$env:LOCALAPPDATA\OTA Business Data\pgdata\PG_VERSION")) { throw "Uninstall removed the user's database" }
          Write-Host "Uninstall kept the database folder."

      # Keep this build's installers aside: the update test below builds a newer one in the same place.
      - name: Stage installers
        run: |
          New-Item -ItemType Directory -Force build/release/msi, build/release/exe | Out-Null
          Copy-Item build/compose/binaries/main/msi/*.msi build/release/msi/
          Copy-Item build/compose/binaries/main/exe/*.exe build/release/exe/

      - uses: actions/upload-artifact@v4
        with:
          name: OTA-Business-Windows
          path: |
            desktop/build/release/msi/*.msi
            desktop/build/release/exe/*.exe
          if-no-files-found: error

      # The update path users take, with the real installers: previous release with realistic and
      # unsynced data -> manual install of this build -> in-app update to a newer build from a local
      # feed. Every table's rows and checksums must survive, with no duplicates (desktop/ci/update-e2e.ps1).
      - name: Build a newer version for the update test
        run: |
          $version = ((Get-Content gradle.properties | Select-String '^otaDesktopVersion=').Line -split '=')[1].Trim()
          $parts = $version.Split('.')
          $parts[-1] = [string]([int]$parts[-1] + 1)
          $next = $parts -join '.'
          "NEXT_VERSION=$next" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          ./gradlew.bat packageMsi -PpgPlatform=windows-amd64 "-PotaDesktopVersion=$next" --console=plain
          if ($LASTEXITCODE -ne 0) { throw "Building $next failed" }

      - name: Update test (previous release -> this build -> in-app update)
        run: |
          $new = (Get-ChildItem build/release/msi/*.msi | Select-Object -First 1).FullName
          $next = (Get-ChildItem build/compose/binaries/main/msi/*$env:NEXT_VERSION*.msi | Select-Object -First 1).FullName
          if (-not $next) { throw "No $env:NEXT_VERSION installer was built" }
          ./ci/update-e2e.ps1 -NewMsi $new -NextMsi $next -NextVersion $env:NEXT_VERSION

      - name: Update test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-test
          path: |
            ${{ runner.temp }}/update-e2e/*.txt
            ${{ runner.temp }}/update-e2e/*.log
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch Gradle distribution
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          url=$(sed -n 's/^distributionUrl=//p' $props | sed 's#\\:#:#g')
          sha=$(sed -n 's/^distributionSha256Sum=//p' $props)
          name=$(basename "$url"); ver=${name#gradle-}; ver=${ver%-bin.zip}
          zip="$RUNNER_TEMP/$name"
          ok=
          for round in 1 2 3 4 5; do
            for m in "$url" "https://github.com/gradle/gradle-distributions/releases/download/v$ver/$name" "https://mirrors.cloud.tencent.com/gradle/$name"; do
              echo "Round $round: $m"
              if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 600 -o "$zip" "$m" && [ "$(shasum -a 256 "$zip" | cut -d' ' -f1)" = "$sha" ]; then ok=1; break 2; fi
            done
            sleep $((20 * round))
          done
          [ -n "$ok" ] || { echo "Could not download $name"; exit 1; }
          sed -i '' "s#^distributionUrl=.*#distributionUrl=file\\\\://$zip#" $props
          ./gradlew --version

      - name: Test
        run: ./gradlew test -PpgPlatform=darwin-arm64v8 --console=plain

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: desktop/build/test-results/test/*.xml
          if-no-files-found: ignore

      - name: Build installer (DMG)
        run: ./gradlew packageDmg -PpgPlatform=darwin-arm64v8 --console=plain

      # Install the DMG like a user would (drag to Applications), self-test twice (first start creates
      # the cluster, the second re-uses it), then delete the app: the data folder must stay.
      - name: Install and self-test
        run: |
          dmg=$(ls build/compose/binaries/main/dmg/*.dmg | head -n 1)
          echo "Installing $(basename "$dmg") ($(du -h "$dmg" | cut -f1))"
          mnt=$(mktemp -d); hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" "$dmg"
          mkdir -p ~/Applications; ditto "$mnt/OTA Business.app" ~/Applications/"OTA Business.app"; hdiutil detach "$mnt"
          app=~/Applications/"OTA Business.app/Contents/MacOS/OTA Business"
          for run in 1 2; do
            "$app" --self-test "$RUNNER_TEMP/self-test.txt"; cat "$RUNNER_TEMP/self-test.txt"
            grep -qx OK "$RUNNER_TEMP/self-test.txt"
          done
          # The real app window on macOS, signed in with demo data. An empty hosts file keeps it offline.
          ./gradlew e2eData --args=showcase -PpgPlatform=darwin-arm64v8 --console=plain -q
          : > "$RUNNER_TEMP/no-hosts"
          JAVA_TOOL_OPTIONS="-Djdk.net.hosts.file=$RUNNER_TEMP/no-hosts" "$app" > "$RUNNER_TEMP/gui.log" 2>&1 &
          gui=$!
          sleep 40
          mkdir -p build/release/screens
          screencapture -x build/release/screens/macos-home.png || echo "::warning::screencapture failed"
          kill $gui; wait $gui || true
          rm -rf ~/Applications/"OTA Business.app"
          test -f ~/Library/"Application Support/OTA Business Data/pgdata/PG_VERSION"
          echo "Removing the app kept the database folder."
          mkdir -p build/release/dmg; cp "$dmg" build/release/dmg/

      - uses: actions/upload-artifact@v4
        with:
          name: OTA-Business-macOS
          path: desktop/build/release/dmg/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: macos-screenshot
          path: desktop/build/release/screens/*.png
          if-no-files-found: ignore

      - name: Build a newer version for the update test
        run: |
          version=$(sed -n 's/^otaDesktopVersion=//p' gradle.properties | tr -d '[:space:]')
          next="${version%.*}.$(( ${version##*.} + 1 ))"
          echo "NEXT_VERSION=$next" >> "$GITHUB_ENV"
          ./gradlew packageDmg -PpgPlatform=darwin-arm64v8 "-PotaDesktopVersion=$next" --console=plain

      - name: Update test (this build -> in-app update)
        run: |
          new=$(ls build/release/dmg/*.dmg | head -n 1)
          next=$(ls build/compose/binaries/main/dmg/*"$NEXT_VERSION"*.dmg | head -n 1)
          ./ci/update-e2e-mac.sh "$new" "$next" "$NEXT_VERSION"

      - name: Update test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-test-macos
          path: |
            ${{ runner.temp }}/update-e2e/*.txt
            ${{ runner.temp }}/update-e2e/*.log
          if-no-files-found: ignore

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OTA-Business-Windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: OTA-Business-macOS
          path: dist/dmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^otaDesktopVersion=' desktop/gradle.properties | cut -d= -f2)
          tag="${GITHUB_REF_NAME}"
          case "$tag" in desktop-v*) ;; *) tag="desktop-v$version" ;; esac
          mkdir -p out
          cp dist/msi/*.msi "out/OTA-Business-$version.msi"
          cp dist/exe/*.exe "out/OTA-Business-Setup-$version.exe"
          cp dist/dmg/*.dmg "out/OTA-Business-$version-mac-arm64.dmg"
          (cd out && sha256sum OTA-Business-* > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt
          files=(out/*)
          ls -la out
          notes_file="desktop/release-notes/$version.md"
          if [ ! -f "$notes_file" ]; then
            notes_file=$(mktemp)
            printf '%s\n' "OTA Business Desktop $version." "" \
              "**Windows:** download **OTA-Business-$version.msi** (or **OTA-Business-Setup-$version.exe**) and run it. It installs for the current user without admin rights and keeps your data in its own folder. Windows may show a SmartScreen warning because the installer is not code-signed: choose *More info* > *Run anyway*." "" \
              "**Mac (Apple silicon):** download **OTA-Business-$version-mac-arm64.dmg**, open it and drag OTA Business to Applications. The app is not signed by Apple, so the first start is blocked: open *System Settings > Privacy & Security* and choose *Open Anyway* next to OTA Business (once only)." > "$notes_file"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "OTA Business Desktop $version" --notes-file "$notes_file" --target "$GITHUB_SHA"
          fi
