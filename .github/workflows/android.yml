name: Android

on:
  push:
    branches: [main]
    paths: ["app/**", "gradle/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", "supabase.properties", ".github/workflows/android.yml"]
    # android-v…: the last build of the old app (com.example.otaapplication, old key) that moves
    # phones to the new app. phone-v…: the new app (com.ota.business, OTA release key).
    tags: ["android-v*", "phone-v*"]
  pull_request:
    paths: ["app/**", "gradle/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Same as the desktop workflow: hosted runners often time out on services.gradle.org.
      - name: Fetch Gradle distribution
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          url=$(sed -n 's/^distributionUrl=//p' $props | sed 's#\\:#:#g')
          sha=$(sed -n 's/^distributionSha256Sum=//p' $props)
          name=$(basename "$url"); ver=${name#gradle-}; ver=${ver%-bin.zip}
          zip="$RUNNER_TEMP/$name"
          ok=
          for round in 1 2 3 4 5; do
            for m in "$url" "https://github.com/gradle/gradle-distributions/releases/download/v$ver/$name" "https://mirrors.cloud.tencent.com/gradle/$name"; do
              echo "Round $round: $m"
              if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 600 -o "$zip" "$m" && [ "$(sha256sum "$zip" | cut -d' ' -f1)" = "$sha" ]; then ok=1; break 2; fi
            done
            sleep $((20 * round))
          done
          [ -n "$ok" ] || { echo "Could not download $name"; exit 1; }
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\\\://$zip#" $props
          ./gradlew --version

      # The committed local.properties points at a developer's SDK; use the runner's.
      - name: Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^otaAndroidVersion=//p' gradle.properties | tr -d '[:space:]')
          flags=""; cert=860a577393efcfa6a48dbb305b2f4531688a32a29de337244beae72f8f55c3f0
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            # The bridge release keeps the old app's version line, so it comes from the tag.
            version="${GITHUB_REF_NAME#android-v}"
            flags="-PotaAndroidVersion=$version -PotaLegacyBridge=true"
            cert=23d8484a257a568371341c78d8b75707dfdb57533e73f69c7f48257e6ef890fc
          elif [[ "$GITHUB_REF" == refs/tags/phone-v* && "${GITHUB_REF_NAME#phone-v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match otaAndroidVersion=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "cert=$cert" >> "$GITHUB_OUTPUT"

      # Releases must be signed with the key of the app already on the phones (README, "Phone
      # updates"), or Android refuses to install them over it: the old key for android-v…, the OTA
      # release key for phone-v…. Builds that aren't releases use the runner's throwaway debug key.
      - name: Release signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          OLD_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NEW_KEYSTORE_B64: ${{ secrets.OTA_RELEASE_KEYSTORE_BASE64 }}
          NEW_PASSWORD: ${{ secrets.OTA_RELEASE_KEYSTORE_PASSWORD }}
          NEW_KEY_PASSWORD: ${{ secrets.OTA_RELEASE_KEY_PASSWORD }}
          NEW_KEY_ALIAS: ${{ secrets.OTA_RELEASE_KEY_ALIAS }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/phone-v* ]]; then
            b64="$NEW_KEYSTORE_B64"; secret=OTA_RELEASE_KEYSTORE_BASE64
            {
              echo "ANDROID_KEYSTORE_PASSWORD=$NEW_PASSWORD"
              echo "ANDROID_KEY_PASSWORD=${NEW_KEY_PASSWORD:-$NEW_PASSWORD}"
              echo "ANDROID_KEY_ALIAS=${NEW_KEY_ALIAS:-ota-release}"
            } >> "$GITHUB_ENV"
          else
            b64="$OLD_KEYSTORE_B64"; secret=ANDROID_KEYSTORE_BASE64
          fi
          if [ -z "$b64" ]; then
            echo "::error::Add the $secret repository secret (README, Phone updates) before releasing."
            exit 1
          fi
          printf '%s' "$b64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test and build
        run: ./gradlew ${{ steps.version.outputs.flags }} :app:testDebugUnitTest :app:assembleRelease --console=plain

      - name: Collect APK
        run: |
          version=${{ steps.version.outputs.version }}
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/OTA-Business-$version.apk"
          "$apksigner" verify --print-certs "out/OTA-Business-$version.apk" | tee out/signer.txt
          if [[ "$GITHUB_REF" == refs/tags/* ]] && ! grep -qi "certificate SHA-256 digest: ${{ steps.version.outputs.cert }}" out/signer.txt; then
            echo "::error::The APK is not signed with the expected key (${{ steps.version.outputs.cert }})."
            exit 1
          fi
          ls -la out
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: OTA-Business-Android
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/android-v') || startsWith(github.ref, 'refs/tags/phone-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OTA-Business-Android
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#*-v}"
          mkdir -p out
          cp "dist/OTA-Business-$version.apk" out/
          (cd out && sha256sum OTA-Business-*.apk > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt
          cert=$(sed -n 's/.*certificate SHA-256 digest: //p' dist/signer.txt | head -n 1)
          notes=$(mktemp)
          if [[ "$tag" == phone-v* ]]; then title="OTA Business phone app $version"; else title="OTA Business Android $version (move to the new app)"; fi
          if [ -f "app/release-notes/$version.md" ]; then cat "app/release-notes/$version.md" > "$notes"; else echo "OTA Business phone app $version." > "$notes"; fi
          printf '\n\n%s\n' "Signing certificate SHA-256: \`$cert\`" >> "$notes"
          files=(out/*)
          # Not marked "Latest": that stays the desktop release, which the README links to.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$title" --notes-file "$notes" --target "$GITHUB_SHA" --latest=false
          fi
